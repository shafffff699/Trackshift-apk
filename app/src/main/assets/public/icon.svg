<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sunny Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Ground / Track Bed Warm Sunlight Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Graffiti Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Train Body Gradient -->
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="60%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- White Hoodie Shading -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Red Cap & Shirt Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Blue Jeans Gradient -->
    <linearGradient id="jeansGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- 'T' Golden Yellow-Orange Gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- 'S' Electric Cyan-Blue Gradient -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Map Pin Glossy Red Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <clipPath id="iconClip">
      <rect width="512" height="512" rx="92" />
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- 1. SKY & CITYSCAPE BACKGROUND -->
    <rect width="512" height="512" fill="url(#skyGrad)" />

    <!-- Soft Clouds -->
    <g fill="#ffffff" opacity="0.75">
      <circle cx="310" cy="88" r="28" />
      <circle cx="342" cy="82" r="34" />
      <circle cx="376" cy="90" r="24" />
      <circle cx="230" cy="128" r="22" />
      <circle cx="255" cy="124" r="26" />
    </g>

    <!-- Distant City Skyscrapers (Right) -->
    <g fill="#60a5fa" opacity="0.65">
      <rect x="296" y="96" width="34" height="140" rx="2" />
      <rect x="336" y="114" width="28" height="122" rx="2" />
      <rect x="372" y="72" width="40" height="164" rx="2" />
      <rect x="418" y="54" width="46" height="182" rx="2" />
      <rect x="468" y="92" width="38" height="144" rx="2" />
    </g>
    <!-- Building Sunlight Highlights -->
    <g fill="#fde047" opacity="0.45">
      <rect x="374" y="76" width="8" height="140" />
      <rect x="420" y="58" width="10" height="160" />
    </g>

    <!-- Palm Trees (Left & Right) -->
    <g stroke="#78350f" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M105,160 Q112,95 130,52" />
      <path d="M465,175 Q475,110 490,48" />
    </g>
    <g fill="#16a34a">
      <path d="M130,52 Q95,38 78,62 Q105,58 130,52 Z" />
      <path d="M130,52 Q112,18 142,14 Q138,36 130,52 Z" />
      <path d="M130,52 Q165,30 182,54 Q154,52 130,52 Z" />
      <path d="M130,52 Q160,65 154,88 Q138,70 130,52 Z" />
      <path d="M490,48 Q450,32 435,55 Q465,52 490,48 Z" />
      <path d="M490,48 Q465,64 452,86 Q475,72 490,48 Z" />
    </g>

    <!-- 2. GRAFFITI WALL ON LEFT -->
    <polygon points="0,68 158,176 158,318 0,342" fill="url(#wallGrad)" stroke="#4c1d95" stroke-width="4" />
    <!-- Graffiti Wall Top Coping -->
    <polygon points="0,56 164,168 158,180 0,72" fill="#f59e0b" />
    <!-- Graffiti Crown & Street Art Splashes -->
    <polygon points="14,154 24,196 68,204 74,162 56,174 44,148 32,172" fill="#facc15" stroke="#581c87" stroke-width="4" stroke-linejoin="round" />
    <path d="M0,218 L64,210 L42,254 L88,246 L52,306 L0,312 Z" fill="#fde047" stroke="#3b0764" stroke-width="4" />
    <path d="M8,284 Q42,256 76,292 L82,324 L0,336 Z" fill="#06b6d4" />
    <circle cx="96" cy="222" r="18" fill="#f43f5e" />

    <!-- 3. RAILWAY TRACK BED & CONVERGING RAILS -->
    <polygon points="0,336 245,232 355,232 512,340 512,512 0,512" fill="url(#groundGrad)" />

    <!-- Wooden Sleepers / Ties -->
    <g fill="#d97706" stroke="#78350f" stroke-width="2">
      <polygon points="24,486 488,486 504,506 8,506" />
      <polygon points="52,442 460,442 474,458 38,458" />
      <polygon points="82,404 432,404 444,418 70,418" />
      <polygon points="112,370 404,370 414,382 102,382" />
      <polygon points="142,340 378,340 386,350 134,350" />
    </g>

    <!-- Steel Rails -->
    <polygon points="6,456 228,244 236,244 26,464" fill="#94a3b8" />
    <polygon points="132,512 268,244 276,244 156,512" fill="#cbd5e1" />
    <polygon points="348,244 476,512 454,512 340,244" fill="#cbd5e1" />
    <polygon points="378,244 512,412 512,428 372,244" fill="#94a3b8" />

    <!-- 4. COMMUTER SUBWAY TRAIN ON RIGHT -->
    <g>
      <!-- Train Body Perspective -->
      <polygon points="325,172 412,138 412,265 325,248" fill="#3b82f6" />
      <!-- Train Front Cab -->
      <rect x="404" y="136" width="96" height="136" rx="18" fill="url(#trainGrad)" stroke="#1e293b" stroke-width="4" />
      <!-- Train Roof Highlight -->
      <path d="M412,150 Q452,132 492,150" fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
      <!-- Destination LED Sign -->
      <rect x="434" y="148" width="36" height="11" rx="3" fill="#facc15" stroke="#0f172a" stroke-width="2" />
      <!-- Windshield & Center Door -->
      <rect x="414" y="168" width="24" height="44" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
      <rect x="442" y="172" width="20" height="58" rx="3" fill="#1e293b" stroke="#60a5fa" stroke-width="2" />
      <rect x="466" y="168" width="24" height="44" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
      <!-- Glowing Yellow Headlights -->
      <circle cx="422" cy="236" r="10" fill="#fef08a" />
      <circle cx="422" cy="236" r="16" fill="#facc15" opacity="0.45" />
      <circle cx="482" cy="236" r="10" fill="#fef08a" />
      <circle cx="482" cy="236" r="16" fill="#facc15" opacity="0.45" />
      <!-- Train Undercarriage -->
      <rect x="408" y="258" width="88" height="18" rx="4" fill="#0f172a" />
    </g>

    <!-- 5. FLOATING GOLDEN STAR COINS ON RIGHT TRACK -->
    <g>
      <!-- Coin 1 (Far) -->
      <circle cx="404" cy="264" r="13" fill="url(#coinGrad)" stroke="#a16207" stroke-width="2.5" />
      <!-- Coin 2 -->
      <circle cx="446" cy="276" r="16" fill="url(#coinGrad)" stroke="#a16207" stroke-width="2.5" />
      <!-- Coin 3 -->
      <ellipse cx="478" cy="312" rx="22" ry="24" fill="url(#coinGrad)" stroke="#a16207" stroke-width="3" />
      <polygon points="478,298 482,307 492,308 485,315 487,324 478,319 469,324 471,315 464,308 474,307" fill="#eab308" />
      <!-- Coin 4 (Foreground) -->
      <ellipse cx="494" cy="396" rx="28" ry="34" fill="url(#coinGrad)" stroke="#a16207" stroke-width="3.5" />
      <polygon points="494,376 499,389 512,391 502,400 505,413 494,406 483,413 486,400 476,391 489,389" fill="#eab308" />
    </g>

    <!-- 6. STYLIZED 3D BOY RUNNER (LEFT-CENTER) -->
    <g>
      <!-- Right Extended Arm (Left side of image) -->
      <path d="M108,198 Q66,192 46,214 L62,238 Q88,230 116,232 Z" fill="url(#hoodieGrad)" stroke="#64748b" stroke-width="3" />
      <!-- Right Hand -->
      <circle cx="42" cy="226" r="15" fill="url(#skinGrad)" stroke="#9a3412" stroke-width="2.5" />
      <!-- Red Cuff -->
      <ellipse cx="56" cy="224" rx="7" ry="15" transform="rotate(-18 56 224)" fill="url(#redGrad)" />

      <!-- Runner Legs (Blue Jeans) -->
      <!-- Back Leg -->
      <path d="M150,300 L176,356 L146,368 L124,306 Z" fill="#1e3a8a" />
      <!-- Back Sneaker -->
      <ellipse cx="162" cy="370" rx="18" ry="22" fill="url(#redGrad)" stroke="#ffffff" stroke-width="4" />

      <!-- Front Kicking Leg (Jeans + White Cuff) -->
      <path d="M114,264 Q76,314 58,366 L142,380 Q158,326 174,284 Z" fill="url(#jeansGrad)" stroke="#172554" stroke-width="3.5" />
      <path d="M52,356 Q96,342 144,368 L140,390 Q94,368 48,378 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5" />

      <!-- Big Foreground Sneaker Kick (Bottom-Left) -->
      <g transform="rotate(-14 108 428)">
        <!-- Red & White Sneaker Upper -->
        <rect x="46" y="362" width="118" height="128" rx="56" fill="url(#redGrad)" stroke="#7f1d1d" stroke-width="3.5" />
        <!-- Thick White Midsole Rim -->
        <rect x="52" y="382" width="106" height="112" rx="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
        <!-- Dark Grey Tread Sole -->
        <rect x="62" y="396" width="86" height="90" rx="40" fill="#475569" stroke="#1e293b" stroke-width="3" />
        <!-- Sole Tread Grooves -->
        <line x1="70" y1="422" x2="140" y2="422" stroke="#1e293b" stroke-width="4" />
        <line x1="68" y1="444" x2="142" y2="444" stroke="#1e293b" stroke-width="4" />
        <line x1="72" y1="466" x2="138" y2="466" stroke="#1e293b" stroke-width="4" />
      </g>

      <!-- Torso: Red Shirt + White Open Hoodie + Blue Backpack Straps -->
      <path d="M112,188 L208,204 L188,298 L104,274 Z" fill="url(#redGrad)" stroke="#7f1d1d" stroke-width="3" />
      <!-- Left Hoodie Side -->
      <path d="M104,178 Q88,232 94,278 L124,272 Q122,226 132,186 Z" fill="url(#hoodieGrad)" stroke="#94a3b8" stroke-width="2.5" />
      <!-- Right Hoodie Side + Forward Arm -->
      <path d="M196,192 Q232,224 238,268 L178,296 Q172,248 184,198 Z" fill="url(#hoodieGrad)" stroke="#94a3b8" stroke-width="2.5" />
      <!-- Blue Backpack Straps -->
      <path d="M122,184 L96,242 L114,248 L138,190 Z" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2.5" />
      <path d="M188,198 L208,244 L190,250 L174,202 Z" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2.5" />

      <!-- Forward Reaching Hand -->
      <g>
        <ellipse cx="182" cy="264" rx="26" ry="20" transform="rotate(-12 182 264)" fill="url(#skinGrad)" stroke="#9a3412" stroke-width="2.5" />
        <rect x="150" y="246" width="28" height="12" rx="6" transform="rotate(-8 150 246)" fill="url(#skinGrad)" stroke="#9a3412" stroke-width="2" />
      </g>

      <!-- Outer White Hoodie Hood Framing Head -->
      <path d="M106,154 C96,68 172,30 242,52 C298,70 306,144 268,206 C244,234 148,228 114,192 Z" fill="url(#hoodieGrad)" stroke="#94a3b8" stroke-width="4" />
      <!-- Inner Hood Shadow -->
      <path d="M122,152 C116,82 178,48 238,66 C284,80 288,144 256,194 C232,218 152,214 126,184 Z" fill="#451a03" />

      <!-- Boy's Head & Expressive Face -->
      <g>
        <!-- Left Ear -->
        <ellipse cx="144" cy="166" rx="14" ry="20" transform="rotate(-14 144 166)" fill="url(#skinGrad)" stroke="#9a3412" stroke-width="2.5" />
        <!-- Face Shape -->
        <path d="M156,118 C156,86 258,92 264,138 C268,184 234,222 198,218 C164,214 150,174 156,118 Z" fill="url(#skinGrad)" stroke="#9a3412" stroke-width="3" />

        <!-- Brown Swept Hair Under Cap -->
        <path d="M148,136 C152,102 204,96 268,122 C254,108 228,118 206,126 C188,112 166,124 148,136 Z" fill="#451a03" />

        <!-- Eyebrows -->
        <path d="M174,132 Q194,126 208,136" fill="none" stroke="#3b0764" stroke-width="6.5" stroke-linecap="round" />
        <path d="M226,140 Q244,136 256,148" fill="none" stroke="#3b0764" stroke-width="6" stroke-linecap="round" />

        <!-- Large Glossy Brown Eyes -->
        <!-- Left Eye -->
        <ellipse cx="190" cy="154" rx="16" ry="15" fill="#ffffff" stroke="#451a03" stroke-width="3" />
        <circle cx="192" cy="154" r="10.5" fill="#78350f" />
        <circle cx="192" cy="154" r="6" fill="#0f172a" />
        <circle cx="188" cy="150" r="3.5" fill="#ffffff" />
        <!-- Right Eye -->
        <ellipse cx="240" cy="164" rx="14" ry="14" fill="#ffffff" stroke="#451a03" stroke-width="3" />
        <circle cx="240" cy="164" r="9.5" fill="#78350f" />
        <circle cx="240" cy="164" r="5.5" fill="#0f172a" />
        <circle cx="236" cy="160" r="3" fill="#ffffff" />

        <!-- Cute Nose -->
        <path d="M216,162 Q224,174 212,178" fill="none" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round" />

        <!-- Cheerful Open Smile -->
        <path d="M186,182 Q210,194 232,190 Q220,212 198,208 Q186,202 186,182 Z" fill="#7f1d1d" stroke="#9a3412" stroke-width="2.5" />
        <!-- Upper White Teeth -->
        <path d="M190,184 Q210,192 228,190 L225,197 Q208,199 191,192 Z" fill="#ffffff" />
        <!-- Pink Tongue -->
        <path d="M196,202 Q208,198 218,204 Q208,210 196,202 Z" fill="#fb7185" />
      </g>

      <!-- Red & White Baseball Cap Under Hood -->
      <g>
        <!-- Cap Crown (Red Side + White Front Panel) -->
        <path d="M148,112 C156,56 246,52 280,108 Z" fill="url(#redGrad)" stroke="#7f1d1d" stroke-width="3" />
        <path d="M192,62 C224,58 258,70 272,104 L184,98 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
        <!-- Curved Red Cap Visor / Brim -->
        <path d="M152,110 C196,86 272,96 304,132 C292,146 270,136 242,126 C204,114 174,116 152,110 Z" fill="url(#redGrad)" stroke="#7f1d1d" stroke-width="3" />
      </g>
    </g>

    <!-- 7. FOREGROUND 'TS' + RED MAP PIN 3D GRAFFITI LOGO (BOTTOM RIGHT) -->
    <g transform="translate(8, 6)">
      <!-- Paint Splatter Drops & Sticker Aura (Cyan, Magenta, Yellow) -->
      <g>
        <!-- Cyan Splashes (Left of T & Right of S) -->
        <path d="M254,238 Q276,202 296,222 L308,252 L248,266 Z" fill="#00e5ff" />
        <path d="M174,386 L216,356 L212,412 L166,408 Z" fill="#00e5ff" />
        <path d="M430,318 L466,304 L452,344 L424,338 Z" fill="#00e5ff" />
        <!-- Pink / Magenta Splashes & Drips -->
        <path d="M424,296 L458,284 L446,316 Z" fill="#ff2a85" />
        <path d="M238,448 L286,432 L318,454 L276,466 Z" fill="#ff2a85" />
        <!-- Yellow Outer Sticker Shield & Drips -->
        <path d="M194,274 L302,236 C304,192 346,168 380,192 C402,208 402,240 392,258 L452,278 L434,332 C460,354 460,404 428,432 L352,456 L352,482 C352,488 344,488 344,482 L344,458 L302,462 L214,462 L176,488 L194,432 L218,324 L178,334 Z" fill="#fde047" />
      </g>

      <!-- Heavy Dark Navy 3D Extrusion Base Behind T, S, and Pin -->
      <polygon points="186,282 308,242 388,246 444,282 422,338 446,374 426,430 342,452 272,446 278,412 252,438 192,454 224,316 184,328" fill="#060b19" stroke="#060b19" stroke-width="16" stroke-linejoin="round" />

      <!-- 'T' Letter (Golden Yellow to Orange Gradient) -->
      <g>
        <!-- T 3D Block Shadow -->
        <polygon points="196,284 328,242 316,292 278,304 242,442 196,454 232,316 190,328" fill="#090e24" stroke="#090e24" stroke-width="10" stroke-linejoin="round" />
        <!-- T Main Face -->
        <polygon points="202,276 326,238 314,282 274,294 238,434 198,446 234,306 194,318" fill="url(#tGrad)" stroke="#fef9c3" stroke-width="3" stroke-linejoin="round" />
        <!-- T Inner Bevel Highlight -->
        <polygon points="208,280 318,246 312,262 204,296" fill="#fef08a" opacity="0.7" />
      </g>

      <!-- 'S' Letter (Electric Cyan to Deep Blue Gradient) -->
      <g>
        <!-- S 3D Block Shadow -->
        <path d="M372,262 L436,284 L416,326 L362,310 C350,308 346,318 358,324 L412,348 C442,362 438,412 396,430 C352,448 302,444 274,428 L294,382 C318,396 354,402 372,392 C382,386 380,374 366,368 L318,348 C288,334 294,286 334,268 C348,262 360,260 372,262 Z" fill="#090e24" stroke="#090e24" stroke-width="14" stroke-linejoin="round" />
        <!-- S Main Face -->
        <path d="M370,256 L432,278 L412,318 L360,302 C346,300 342,312 356,318 L408,342 C438,356 434,404 392,422 C350,440 302,436 276,420 L296,376 C320,390 352,396 370,386 C380,380 378,368 364,362 L316,342 C288,328 294,280 332,262 C346,256 358,254 370,256 Z" fill="url(#sGrad)" stroke="#cffafe" stroke-width="3" stroke-linejoin="round" />
      </g>

      <!-- Glossy Red Map Pin Icon Perched Above T & S -->
      <g transform="translate(342, 236) rotate(-8)">
        <!-- Map Pin Dark Navy Outline & Shadow -->
        <path d="M0,-62 C30,-62 50,-38 50,-12 C50,18 14,48 0,66 C-14,48 -50,18 -50,-12 C-50,-38 -30,-62 0,-62 Z" fill="#090e24" stroke="#090e24" stroke-width="12" stroke-linejoin="round" />
        <!-- Map Pin Red Glossy Body -->
        <path d="M0,-56 C26,-56 44,-34 44,-12 C44,14 12,42 0,58 C-12,42 -44,14 -44,-12 C-44,-34 -26,-56 0,-56 Z" fill="url(#pinGrad)" stroke="#fca5a5" stroke-width="2.5" />
        <!-- Map Pin Rim Highlight -->
        <path d="M-28,-38 C-14,-52 14,-52 28,-38" fill="none" stroke="#fecaca" stroke-width="4" stroke-linecap="round" opacity="0.75" />
        <!-- Map Pin Dark Center Hole -->
        <circle cx="0" cy="-14" r="17" fill="#7f1d1d" />
        <circle cx="0" cy="-14" r="13" fill="#090e24" />
      </g>
    </g>
  </g>
</svg>
