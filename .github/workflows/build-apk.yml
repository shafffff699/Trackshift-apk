name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: Java executable could not be detected." >&2
            exit 1
          fi
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          echo "Detected version line: ${JAVA_VER_LINE}"
          JAVA_MAJOR="$(echo "${JAVA_VER_LINE}" | sed -E 's/.*"([0-9]+)(\.[0-9]+)*".*/\1/')"
          if [[ -z "${JAVA_MAJOR}" || ! "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse active Java major version." >&2
            exit 1
          fi
          echo "Active Java major version: ${JAVA_MAJOR}"
          if (( JAVA_MAJOR < 17 )); then
            echo "ERROR: Active Java version (${JAVA_MAJOR}) is lower than required Java 17." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [[ ! -f "${KEYSTORE_PATH}" ]]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [[ ! -f "${KEYSTORE_PATH}" ]]; then
            echo "ERROR: Temporary debug keystore ./debug.keystore could not be created." >&2
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -e "${EXPECTED_APK}" ]]; then
            echo "ERROR: Expected APK not found at ${EXPECTED_APK}." >&2
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "Searching inside app/build/outputs/apk:" >&2
              find app/build/outputs/apk -name "*.apk" -print >&2 || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          if [[ ! -f "${EXPECTED_APK}" ]]; then
            echo "ERROR: ${EXPECTED_APK} is not a regular file." >&2
            exit 1
          fi
          if [[ ! -s "${EXPECTED_APK}" ]]; then
            echo "ERROR: ${EXPECTED_APK} is empty." >&2
            exit 1
          fi
          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "ERROR: ${EXPECTED_APK} does not have the .apk extension." >&2
            exit 1
          fi
          if [[ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]]; then
            echo "ERROR: Unexpected APK path: ${EXPECTED_APK}" >&2
            exit 1
          fi
          echo "Verified APK at ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          PREPARED_APK="${TEMP_RELEASE_DIR}/app-debug.apk"
          cp "${SOURCE_APK}" "${PREPARED_APK}"
          if [[ ! -f "${PREPARED_APK}" || ! -s "${PREPARED_APK}" ]]; then
            echo "ERROR: Failed to prepare release asset at ${PREPARED_APK}" >&2
            exit 1
          fi
          echo "asset_path=${PREPARED_APK}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available." >&2
            exit 1
          fi
          gh --version
          if [[ -z "${PREPARED_APK}" || ! -f "${PREPARED_APK}" ]]; then
            echo "ERROR: Prepared APK file does not exist at ${PREPARED_APK:-<empty>}." >&2
            exit 1
          fi
          if [[ ! -s "${PREPARED_APK}" ]]; then
            echo "ERROR: Prepared APK file is empty." >&2
            exit 1
          fi
          if [[ "${PREPARED_APK}" != *.apk ]]; then
            echo "ERROR: Prepared APK does not end in .apk." >&2
            exit 1
          fi
          ASSET_FILENAME="$(basename "${PREPARED_APK}")"
          if [[ "${ASSET_FILENAME}" != "app-debug.apk" ]]; then
            echo "ERROR: Release asset filename must be app-debug.apk, got ${ASSET_FILENAME}." >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"

          cat <<EOF > "${NOTES_FILE}"
          ### Automated Debug APK Build

          - **Status:** Automatically generated debug APK built by GitHub Actions.
          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Purpose:** Intended for testing only. Not a Play Store production release.
          - **Signing:** Signed only with a temporary debug keystore.
          EOF

          gh release create "${RELEASE_TAG}" "${PREPARED_APK}#app-debug.apk" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}" \
            --latest
